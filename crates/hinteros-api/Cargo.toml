[package]
name = "hinteros-api"
description = "HinterOS socket API: wire types, framing, handshake and client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# JSON Schema validation against schema/*.json, for tests in this workspace.
conformance = ["dep:jsonschema"]

[dependencies]
jsonschema = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
hinteros-api = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
