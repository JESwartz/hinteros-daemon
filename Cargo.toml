[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://justsomeshed.com/JSwartz/HinterOS/hinteros-daemon"

[workspace.dependencies]
hinteros-api = { path = "crates/hinteros-api" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
jsonschema = { version = "0.58", default-features = false }
rustix = { version = "1", features = ["process", "thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.4"
tempfile = "3"
thiserror = "2"
toml = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x11rb = "0.14"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
