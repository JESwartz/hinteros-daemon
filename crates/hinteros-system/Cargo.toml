[package]
name = "hinteros-system"
description = "HinterOS privileged system service: settings, rebuilds, updates, rollback"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ab_glyph.workspace = true
anyhow.workspace = true
argon2 = { version = "0.5", features = ["std"] }
base64.workspace = true
clap.workspace = true
futures-util.workspace = true
hinteros-api.workspace = true
nix = { workspace = true, features = ["user"] }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tz-rs.workspace = true
zbus.workspace = true
zeroize.workspace = true

[dev-dependencies]
hinteros-api = { workspace = true, features = ["conformance"] }
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

# The workspace's lints, but `unsafe_code` denied instead of forbidden: `vtio` (the
# framebuffer and VT ioctls of the splash) is the one module allowed to use it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
