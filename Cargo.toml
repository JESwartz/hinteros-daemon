[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://justsomeshed.com/JSwartz/HinterOS/hinteros-daemon"

[workspace.dependencies]
hinteros-api = { path = "crates/hinteros-api" }
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
anyhow = "1"
base64 = "0.22"
bitflags = "2"
clap = { version = "4", features = ["derive", "env"] }
evdev = "0.13"
futures-util = "0.3"
nix = { version = "0.31", features = ["socket"] }
proptest = { version = "1", default-features = false, features = ["std"] }
jsonschema = { version = "0.58", default-features = false }
rustix = { version = "1", features = ["event", "fs", "process", "rand", "termios", "thread", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.4"
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
toml = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-server = "0.31"
x11rb = { version = "0.14", features = ["res"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
